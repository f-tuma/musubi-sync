# cargo-deny policy (docs/plan/phase1.md, chapter 7).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# Any advisory (vulnerability, unmaintained, unsound, yanked) fails the check
# unless listed here with a reason and a review date. `yanked` is set
# explicitly: the cargo-deny default is "warn".
yanked = "deny"
# No exceptions: K6 signs tokens with Ed25519 from `ring` directly, so neither
# `rsa` (RUSTSEC-2023-0071) nor `crypto-bigint` 0.5 (RUSTSEC-2026-0387) is in the tree.
ignore = []

[licenses]
# Permissive only. Copyleft (GPL, LGPL, AGPL, EUPL, MPL) is not allowed.
# Anything else needs a per-crate exception below with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # Mozilla's root certificates as data, pulled by rustls-platform-verifier
    # (reqwest 0.13 with rustls, musubi-google, K4). CDLA-Permissive-2.0 is a
    # permissive data licence: use and redistribution without conditions beyond
    # keeping the licence text.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]
# The list covers the planned phase 1 stack; entries unused by today's tree are fine.
unused-allowed-license = "allow"

[bans]
# No duplicate crate versions without an explicit `skip` entry with a reason.
# The phase 1 stack will need some (docs/plan/phase1.md, chapter 7); each
# checkpoint adds those its dependencies bring.
multiple-versions = "deny"
# Dependency direction between workspace crates is not checked here: cargo-deny
# cannot tell dev-dependencies apart. See crates/musubi-testkit/tests/dependency_direction.rs.
wildcards = "deny"
skip = [
    # syn 2 next to syn 3: jni-macros and jni-sys-macros (rustls-platform-verifier
    # on Android, via reqwest in musubi-google, K4) and jiff-static are still on
    # syn 2. Drop when they move to syn 3.
    { crate = "syn@2", reason = "jni (rustls-platform-verifier) and jiff-static still use syn 2" },
    # ring 0.17 pins windows-sys 0.52; everything else (tokio, rustls-platform-verifier)
    # is on 0.61. ring is the rustls provider by decision (no aws-lc-rs). K4.
    { crate = "windows-sys@0.52", reason = "ring 0.17 still uses windows-sys 0.52" },
    # ring 0.17 uses getrandom 0.2; tempfile (data directories of the musubi-testkit
    # `bench` binary, K7) uses 0.4. Drop when ring moves on.
    { crate = "getrandom@0.2", reason = "ring 0.17 still uses getrandom 0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
