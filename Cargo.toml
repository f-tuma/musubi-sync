[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 spikes are standalone experiments with their own lockfiles.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/f-tuma/musubi-sync"

[workspace.dependencies]
# Internal crates. Which crate may depend on which is checked by
# crates/musubi-testkit/tests/dependency_direction.rs (see CONTRIBUTING.md).
musubi-model = { path = "crates/musubi-model", version = "0.0.0" }
musubi-recurrence = { path = "crates/musubi-recurrence", version = "0.0.0" }
musubi-store-sqlite = { path = "crates/musubi-store-sqlite", version = "0.0.0" }
musubi-google = { path = "crates/musubi-google", version = "0.0.0" }
musubi-engine = { path = "crates/musubi-engine", version = "0.0.0" }
musubi-testkit = { path = "crates/musubi-testkit", version = "0.0.0" }

async-trait = "0.1.92"
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false }
# Only for the vendored rrule core in musubi-recurrence (civil time marked UTC);
# no "clock", so no host time zone is ever consulted.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-core = { version = "0.3.34", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.34", default-features = false }
http = { version = "1.5.0", default-features = false, features = ["std"] }
# Bundled tzdb only (jiff-tzdb), never the host's /usr/share/zoneinfo or local
# zone: recurrence expansion must give the same result on every machine.
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
jiff = { version = "0.2.43", default-features = false, features = [
    "std",
    "tz-fat",
    "tzdb-bundle-always",
    "perf-inline",
    "serde",
] }
# rustls with ring, never aws-lc-rs (C and CMake; proposal chapter 8). reqwest's
# `rustls-no-provider` takes the process default provider, which musubi-google
# installs from `rustls` below.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "form",
    "query",
    "json",
] }
# Ed25519 tokens, AES-256-GCM token sealing, SHA-256 and randomness of
# musubi-syncd: already in the tree as the rustls provider, so no extra crypto
# crates (plan, chapter 7).
ring = "0.17.14"
# Bundled SQLite, built with LIBSQLITE3_FLAGS from .cargo/config.toml. The default
# feature only adds a wasm backend.
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "backup", "cache"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
zeroize = "1.9.1"

# Test-only.
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json"] }
# Without `fork`/`timeout` (rusty-fork, tempfile): not needed, fewer duplicates.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
