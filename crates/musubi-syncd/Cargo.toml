[package]
name = "musubi-syncd"
description = "musubi-sync server binary: HTTP API, webhooks, OAuth, backup and restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
musubi-model.workspace = true
musubi-recurrence.workspace = true
musubi-store-sqlite.workspace = true
musubi-google.workspace = true
musubi-engine.workspace = true
musubi-dav.workspace = true
musubi-ical.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
reqwest.workspace = true
ring.workspace = true
# Online copy of control.db for `backup` (`VACUUM INTO`).
rusqlite.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Request concurrency limit and timeout on the non-streaming routes.
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
zeroize.workspace = true

[features]
# Test-only kill points for tests/crash.rs; never enabled in release builds.
crash-points = ["musubi-store-sqlite/crash-points"]

[dev-dependencies]
musubi-testkit.workspace = true
tempfile.workspace = true

[[test]]
name = "crash"
required-features = ["crash-points"]

# Needs `MUSUBI_RADICALE`; run by the CI job `conformance`.
[[test]]
name = "radicale"
path = "tests/radicale.rs"
test = false

[lints]
workspace = true
