[package]
name = "musubi-testkit"
description = "Test fixtures for musubi-sync: FakeProvider, fake Google server, crash harness, load generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
musubi-model.workspace = true
async-trait.workspace = true
futures-core.workspace = true
http.workspace = true
jiff.workspace = true
secrecy.workspace = true
# Fake Google server (src/google.rs): in-process HTTP over 127.0.0.1.
axum = { workspace = true, features = ["http1", "tokio", "json", "query", "form"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Request bodies of the fake DAV server (src/dav.rs).
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
# PKCE S256 and id_token encoding of the authorization-code grant.
base64.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
# Whole-binary harness (src/harness.rs) and the `bench` binary: the HTTP client
# side of musubi-syncd, with the ring provider reqwest's rustls takes.
reqwest.workspace = true
rustls.workspace = true
# Data directories of the `bench` nodes.
tempfile.workspace = true

# Needs the musubi-syncd binary and (for Radicale) MUSUBI_RADICALE; run by the
# CI job `conformance`, not by `cargo test --workspace`.
[[test]]
name = "conformance"
path = "tests/conformance.rs"
test = false

[lints]
workspace = true
