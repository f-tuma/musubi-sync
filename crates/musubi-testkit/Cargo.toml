[package]
name = "musubi-testkit"
description = "Test fixtures for musubi-sync: FakeProvider, fake Google server, crash harness, load generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
musubi-model.workspace = true
async-trait.workspace = true
futures-core.workspace = true
http.workspace = true
jiff.workspace = true
secrecy.workspace = true
# Fake Google server (src/google.rs): in-process HTTP over 127.0.0.1.
axum = { workspace = true, features = ["http1", "tokio", "json", "query", "form"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
# PKCE S256 and id_token encoding of the authorization-code grant.
base64.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
