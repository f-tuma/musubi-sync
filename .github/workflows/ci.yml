# CI of the workspace (docs/plan/phase1.md, chapter 7).
# Actions are pinned to commit SHAs; the comment names the release.
# The Rust toolchain comes from rust-toolchain.toml.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily: cargo deny (new advisories) and the nightly job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Includes the dependency-direction check (musubi-testkit/tests/dependency_direction.rs).
      - run: cargo test --workspace --locked
      # K1: only an optimized build writes fast enough to reach the WAL hard
      # limit and exercise the TRUNCATE path; the test asserts it in release.
      - run: cargo test -p musubi-store-sqlite --release --locked --test import -- --nocapture
      # K7 (6.3): 20 SIGKILLs of the whole musubi-syncd binary. `crash-points` is an
      # off-by-default feature that only this test target requires.
      - run: cargo test -p musubi-syncd --features crash-points --release --locked --test crash -- --nocapture

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  bench-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `bench` runs the musubi-syncd binary next to it.
      - run: cargo build --release --locked -p musubi-syncd -p musubi-testkit --bins
      - run: target/release/bench --smoke
      # B8 and B9 are crate benches: musubi-testkit may not depend on google or recurrence.
      - run: cargo bench --locked -p musubi-google -p musubi-recurrence --benches
        env:
          MUSUBI_BENCH_SMOKE: "1"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # K1: kill -9 in the middle of apply_page, 1000 rounds (the PR test runs 200).
      - run: cargo test -p musubi-store-sqlite --release --locked --test crash
        env:
          MUSUBI_CRASH_ROUNDS: "1000"
      # K7 (6.3): 1000 SIGKILLs of the whole binary (50 runs of 20); a failing run prints its seed.
      - run: cargo test -p musubi-syncd --features crash-points --release --locked --test crash -- --nocapture
        env:
          MUSUBI_SYNCD_CRASH_RUNS: "50"
      # K7 (6.5): full-scale benchmarks against their budgets.
      - if: ${{ !cancelled() }}
        run: cargo build --release --locked -p musubi-syncd -p musubi-testkit --bins
      - if: ${{ !cancelled() }}
        run: target/release/bench
      - if: ${{ !cancelled() }}
        run: cargo bench --locked -p musubi-google -p musubi-recurrence --benches
      # The recurrence fuzz harness (K2) is the `fuzz-recurrence` job.

  fuzz-recurrence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/musubi-recurrence/fuzz
          # Not true (the default): a cached cargo-afl skips `cargo install`, but rust-cache
          # prunes registry/src, where `cargo afl config --build` finds the AFL++ sources.
          cache-bin: false
      - run: cargo install cargo-afl --locked --version 0.18.2
      - run: cargo afl config --build --force
      - run: crates/musubi-recurrence/fuzz/run.sh 600
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recurrence-fuzz-out
          path: crates/musubi-recurrence/fuzz/crashes
